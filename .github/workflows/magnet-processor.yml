# .github/workflows/magnet-processor.yml
name: 磁力链接批量处理

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  # 添加 push 触发，方便测试
  push:
    branches:
      - main
      - master
    paths:
      - 'Input/**'
      - 'magnet_processor.py'

jobs:
  process-magnets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout 代码
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        # 确保拉取所有历史记录
        fetch-depth: 0
    
    - name: 列出 Input 目录内容（调试）
      run: |
        echo "=== Input 目录内容 ==="
        ls -la Input/ || echo "Input 目录不存在或为空"
        echo "=== 文件列表 ==="
        find Input -type f -name "*.xlsx" -o -name "*.xls" -o -name "*.xlsm" || echo "未找到 Excel 文件"
        echo "=== 文件哈希值 ==="
        find Input -type f -name "*.xlsx" -exec md5sum {} \; || echo "未找到 Excel 文件"
    
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests openpyxl xlsxwriter Pillow
    
    - name: 创建输出目录
      run: |
        mkdir -p Output
    
    - name: 运行处理程序
      run: |
        python magnet_processor.py
    
    - name: 列出 Output 目录内容（调试）
      if: always()
      run: |
        echo "=== Output 目录内容 ==="
        ls -la Output/ || echo "Output 目录不存在或为空"
        echo "=== 输出文件列表 ==="
        find Output -type f || echo "未找到输出文件"
    
    - name: 提交进度文件
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -f Output/.progress.json
        git diff --staged --quiet || git commit -m "更新处理进度 [skip ci]"
        git push
    
    - name: 上传输出文件
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: output-files-${{ github.run_id }}
        path: Output/*.xlsx
        retention-days: 30

# .github/workflows/magnet-processor.yml
name: 磁力链接批量处理

on:
  schedule:
    - cron: '0 2 * * *'  # 每天凌晨2点运行
  workflow_dispatch:      # 支持手动触发
  push:
    branches:
      - main
      - master
    paths:
      - 'Input/**'
      - 'magnet_processor.py'

jobs:
  process-magnets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout 代码
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        fetch-depth: 0
    
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests openpyxl xlsxwriter Pillow
    
    - name: 创建输出目录
      run: |
        mkdir -p Input
        mkdir -p Output
    
    - name: 运行处理程序
      run: |
        python magnet_processor.py
    
    - name: 提交进度文件和输出文件
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        # 强制添加进度文件和输出文件
        git add -f Output/.progress.json
        git add -f Output/*.xlsx
        git diff --staged --quiet || git commit -m "更新处理进度和输出文件 [skip ci]"
        git push
    
    - name: 上传输出文件到 Artifacts（备份）
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: output-files-${{ github.run_id }}
        path: Output/*.xlsx
        retention-days: 30

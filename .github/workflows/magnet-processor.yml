# .github/workflows/magnet-processor.yml
name: 磁力链接批量处理

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  process-magnets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout 代码
      uses: actions/checkout@v5
      with:
        persist-credentials: true
    
    - name: 设置 Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests openpyxl xlsxwriter Pillow
    
    - name: 创建目录
      run: |
        mkdir -p Input
        mkdir -p Output
    
    - name: 运行处理程序
      run: |
        python magnet_processor.py
    
    - name: 提交进度和输出
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add Output/.progress.json
        git add Output/*.xlsx
        git diff --staged --quiet || git commit -m "更新处理进度和输出 [skip ci]"
        git push

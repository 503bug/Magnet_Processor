name: 磁力链接批量处理（每6分钟触发）

on:
  schedule:
    - cron: '*/6 * * * *'   # 每6分钟触发一次，这是GitHub允许的最小间隔
  workflow_dispatch:        # 同时支持手动触发

# 保证同一时刻只有一个运行实例（新的触发会排队等待旧的完成）
concurrency:
  group: magnet-processor
  cancel-in-progress: false

jobs:
  # 1. 生成待处理文件矩阵（只扫描未完成的文件）
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.set-matrix.outputs.files }}
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: 生成文件列表
        id: set-matrix
        run: |
          mkdir -p Input Output
          MATRIX_JSON=$(python3 - << 'EOF'
          import json, os, glob
          from pathlib import Path

          input_dir = Path("Input")
          output_dir = Path("Output")
          files = []

          for ext in ['*.xlsx', '*.xlsm', '*.xls']:
              for f in glob.glob(str(input_dir / ext)):
                  file_path = Path(f)
                  progress_file = output_dir / f".progress_{file_path.stem}.json"
                  completed = False
                  if progress_file.exists():
                      try:
                          import json as json_mod
                          with open(progress_file, 'r') as pf:
                              state = json_mod.load(pf)
                              completed = state.get('completed', False)
                      except:
                          pass
                  if not completed:
                      files.append(str(file_path))

          print(json.dumps(files))
          EOF
          )
          echo "files=${MATRIX_JSON}" >> $GITHUB_OUTPUT

  # 2. 并发处理每个未完成的文件（每个文件一个独立作业）
  process-file:
    needs: generate-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 单文件最长6小时
    strategy:
      fail-fast: false      # 一个文件失败不影响其他
      matrix:
        file: ${{ fromJSON(needs.generate-matrix.outputs.files) }}
    # 如果没有文件，跳过此作业（避免无意义运行）
    if: ${{ needs.generate-matrix.outputs.files != '[]' && needs.generate-matrix.outputs.files != '' }}
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl xlsxwriter Pillow

      - name: 创建目录
        run: mkdir -p Input Output

      - name: 处理指定文件
        run: python magnet_processor.py --input-file "${{ matrix.file }}"
        env:
          MAX_RUN_TIME: 350          # 单次运行350分钟（略低于作业超时）
          MAX_ROWS_PER_RUN: 999999   # 每轮尽量处理全部行

      - name: 提交该文件产生的输出
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          INPUT_BASE=$(basename "${{ matrix.file }}" .xlsx)
          git add -f "Output/.progress_${INPUT_BASE}.json" || true
          git add -f "Output/*_${INPUT_BASE}.xlsx" || true

          if ! git diff --staged --quiet; then
            for i in {1..5}; do
              git commit -m "处理文件 ${INPUT_BASE} [skip ci]" --no-edit && \
              git pull --rebase && \
              git push && break || sleep 2
            done
          fi

      - name: 上传该文件的批次文件到 Artifacts（可选）
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: output-${{ matrix.file }}-${{ github.run_id }}
          path: Output/*_${{ matrix.file }}.xlsx
          retention-days: 30
          if-no-files-found: warn
